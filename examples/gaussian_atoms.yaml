units:
  length: bohr
  energy: hartree

lattice:
  vectors:
    - [8.0, 0.0, 0.0]
    - [0.0, 8.0, 0.0]
    - [0.0, 0.0, 8.0]

electrons: 2
encut: 1.0
bands: 4

potential:
  # Educational periodic Gaussian wells, not atom-specific pseudopotentials.
  type: gaussian_atoms
  atoms:
    - position: [0.25, 0.25, 0.25]
      depth: -0.05
      width: 1.50
    - position: [0.75, 0.75, 0.75]
      depth: -0.05
      width: 1.50

scf:
  max_iterations: 80
  density_tolerance: 2.0e-7
  energy_tolerance: 2.0e-7
  mixing_alpha: 0.35
  eigensolver_tolerance: 1.0e-10

dos:
  enabled: true
  points: 101
  width: 0.05
